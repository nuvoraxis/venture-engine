name = "venture-engine-gateway"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[assets]
directory = "../portal/public"
binding = "ASSETS"

[vars]
SERVICE_NAME = "venture-engine-gateway"
TREASURY_ADDRESS = "0x703d3948cc102bf4bc0ef93ef330f56be2afd69c"
NETWORK = "base-mainnet"
BASE_USDC_ADDRESS = "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"

# Required for stateless ve_live_... HMAC B2B API tokens (never commit secrets):
#   npx wrangler secret put VE_TOKEN_SECRET
# Optional static fallback keys or custom RPC overrides:
#   npx wrangler secret put VE_STATIC_API_KEYS
#   npx wrangler secret put BASE_RPC_URL
#   npx wrangler secret put ETH_RPC_URL
#   npx wrangler secret put ARB_RPC_URL
